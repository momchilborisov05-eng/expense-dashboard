<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Expense Dashboard</h1>
    <p class="subtitle">Track your spending and see where your money goes.</p>
  </header>

  <main>
    <section class="cards">
      <div class="card"><span class="label">This month</span><span class="value" id="stat-month">–</span></div>
      <div class="card"><span class="label">Total spent</span><span class="value" id="stat-total">–</span></div>
      <div class="card"><span class="label">Expenses</span><span class="value" id="stat-count">–</span></div>
    </section>

    <section class="charts">
      <div class="panel">
        <h2>By category</h2>
        <div class="chart-box"><canvas id="category-chart"></canvas></div>
      </div>
      <div class="panel">
        <h2>Last 12 months</h2>
        <div class="chart-box"><canvas id="month-chart"></canvas></div>
      </div>
    </section>

    <section class="panel">
      <h2 id="form-title">Add expense</h2>
      <form id="expense-form">
        <input type="hidden" name="expense_id">
        <input name="description" placeholder="Description" required maxlength="200">
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
        <select name="category">
          {% for c in categories %}<option>{{ c }}</option>{% endfor %}
        </select>
        <input name="spent_on" type="date" required>
        <button type="submit" id="submit-btn">Add</button>
        <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
      </form>
      <p id="form-error" class="error" role="alert"></p>
    </section>

    <section class="panel">
      <div class="table-header">
        <h2>Recent expenses</h2>
        <select id="filter">
          <option value="">All categories</option>
          {% for c in categories %}<option>{{ c }}</option>{% endfor %}
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th><th></th></tr></thead>
          <tbody id="expense-rows"></tbody>
        </table>
      </div>
      <p id="empty" class="muted" hidden>No expenses yet. Add your first one above.</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
